name: P1-K analyzer diagnostic

on:
  push:
    branches: [p1k/full-runtime-generation]
    paths: ['.github/workflows/p1k-analyzer-diagnose.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Apply clone implementations
        run: python tools/p1k_green_patch.py
      - name: Analyze files independently
        shell: bash
        run: |
          set +e
          overall=0
          for f in src/cpu/dsv4_full_model.c src/cpu/dsv4_model.c src/cpu/dsv4_mtp.c; do
            log="$RUNNER_TEMP/$(basename "$f").log"
            gcc -O0 -g -std=c99 -Wall -Wextra -Wshadow -Wvla -Werror \
                -fanalyzer -ffp-contract=off -Iinclude/dsv4 -c "$f" \
                -o "$RUNNER_TEMP/$(basename "$f").o" 2>"$log"
            rc=$?
            echo "=== $f rc=$rc ==="
            grep -E 'warning:|error:|note:' "$log" | head -n 120 || true
            if (( rc != 0 )); then overall=1; fi
          done
          exit "$overall"
